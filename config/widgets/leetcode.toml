# LeetCode streak widget. No login or API key: this reads the public
# GraphQL endpoint (matchedUser.userCalendar.submissionCalendar).

[size]
width = 440
height = 250

[layout]
align = "start"

[font.value]
size = 34.0

[show]
title = true
grid = true
legend = true
longest_streak = true

[behavior]
grid_weeks = 26
week_start = "sunday"
remote_interval = 900.0

[leetcode]
username = "lee215"      # <- put your LeetCode username here (this is an example public account)
palette = "leetcode"
title = "LEETCODE"
timeout = 8.0
levels = [1, 3, 6, 10]   # submissions per day needed for grid levels 1-4
