[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnome-desk-widgets"
version = "0.1.0"
description = "Standalone desktop widgets for Ubuntu GNOME, drawn with GTK4 and cairo"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["PyGObject>=3.46", "pycairo>=1.25"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
desk-widgets = "desk_widgets.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "D"]
# E402: gi.require_version() must run before the gi.repository imports.
ignore = ["D100", "D104", "D107", "D203", "D213", "D401", "E402"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]
